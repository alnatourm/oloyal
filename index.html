<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassLoyal OS - Dual Wallet Loyalty Engine (Middle East)</title>
    <meta name="description" content="Ultra-modern dual wallet (Apple Wallet &amp; Google Wallet) loyalty platform built for Middle East merchants, supporting Arabic (RTL) &amp; English." />
    <meta property="og:title" content="PassLoyal OS - Dual Wallet Loyalty Engine" />
    <meta property="og:description" content="Ultra-modern dual wallet (Apple Wallet &amp; Google Wallet) loyalty platform built for Middle East merchants, supporting Arabic (RTL) &amp; English." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pre-hydration language detection to prevent layout shift -->
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('passloyal_language') || 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <!-- Fonts: Inter for Latin, Cairo & IBM Plex Sans Arabic for Arabic RTL -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-[#f7f9fc] text-[#191c1e] font-sans antialiased selection:bg-[#ff5722] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
